[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonbroom"
version = "0.1.0"
description = "Lunar Prospector MAG and ER postprocessing tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pds4_tools>=1.3"]

[project.optional-dependencies]
geometry = ["spiceypy>=6"]
plots = ["matplotlib>=3.7"]
test = ["pytest>=8"]

[project.scripts]
moonbroom-analysis = "moonbroom.analysis_cli:main"
moonbroom-mission = "moonbroom.mission_pipeline:main"
moonbroom-survey = "moonbroom.mission_survey:main"
moonbroom-inputs = "moonbroom.auxiliary_data:main"
moonbroom-omni = "moonbroom.omni:main"
moonbroom-analysis-suite = "moonbroom.analysis_suite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
